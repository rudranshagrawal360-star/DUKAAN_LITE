<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F9F5"/>
      <stop offset="100%" stop-color="#E2F1E8"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E8A45"/>
      <stop offset="100%" stop-color="#086A35"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7BC56"/>
      <stop offset="100%" stop-color="#F4AA2E"/>
    </linearGradient>
    <linearGradient id="g-forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#185934"/>
      <stop offset="100%" stop-color="#124729"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#124729" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Product Illustration Shape -->
  <g filter="url(#drop-shadow)">
    
    <!-- Pouch Body -->
    <path d="M42 36 L118 36 L112 126 A6 6 0 0 1 106 132 L54 132 A6 6 0 0 1 48 126 Z" fill="url(#g-mint)" stroke="#124729" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Top Seal Crimps -->
    <rect x="40" y="30" width="80" height="9" rx="2" fill="url(#g-forest)" stroke="#124729" stroke-width="1.5"/>
    <line x1="48" y1="30" x2="48" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="64" y1="30" x2="64" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="80" y1="30" x2="80" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="96" y1="30" x2="96" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="112" y1="30" x2="112" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Center Graphic Badge -->
    <circle cx="80" cy="74" r="22" fill="#78350F"/>
    <circle cx="80" cy="74" r="18" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="80" cy="74" r="4" fill="#F4AA2E"/>
    
    
  </g>

  <!-- Typography Banner Label -->
  <g transform="translate(80, 114)">
    <rect x="-48" y="-10" width="96" height="20" rx="4" fill="#FFFFFF" stroke="#DDE3E0" stroke-width="1"/>
    <text x="0" y="3" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#124729" text-anchor="middle" letter-spacing="0.5">CHAI DUST</text>
  </g>
</svg>