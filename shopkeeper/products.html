<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products – Shopkeeper Portal – DukaanLite</title>
  
  <!-- Favicons and Brand Icons -->
  <link rel="icon" href="../assets/brand/favicon.ico" sizes="any">
  <link rel="icon" href="../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/brand/icon-180.png">
  <meta name="theme-color" content="#124729">


  <!-- Pre-paint theme: runs before CSS to prevent flash -->
  <script>
    (function(){
      var t=localStorage.getItem('dukaanlite_theme_v1');
      var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));
    })();
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Inter Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- DukaanLite Shared & Shopkeeper Styles -->
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/shopkeeper.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to products list</a>

  <div class="dl-admin-layout">
    
    <!-- Left Sidebar -->
    <aside class="dl-admin-sidebar" aria-label="Shopkeeper Navigation">
      <a class="dl-sidebar-brand" href="dashboard.html" aria-label="DukaanLite Home">
        <div class="dl-sidebar-logo-tile" aria-hidden="true">
          <img src="../assets/brand/logo-mark.png" 
               data-logo-light="../assets/brand/logo-mark.png" 
               data-logo-dark="../assets/brand/logo-mark-dark.png" 
               alt="DukaanLite" width="20" height="22">
        </div>
        <span class="dl-sidebar-brand-name">DukaanLite</span>
      </a>

      <ul class="dl-sidebar-nav">
        <li>
          <a href="dashboard.html" class="dl-sidebar-link">
            <i class="bi bi-speedometer2" aria-hidden="true"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="products.html" class="dl-sidebar-link active" aria-current="page">
            <i class="bi bi-box-seam" aria-hidden="true"></i>
            <span>Products</span>
          </a>
        </li>
        <li>
          <a href="orders.html" class="dl-sidebar-link">
            <i class="bi bi-receipt" aria-hidden="true"></i>
            <span>Orders</span>
            <span class="dl-sidebar-pending-badge" id="sidebar-pending-badge" style="display: none;">0</span>
          </a>
        </li>
        <li>
          <a href="settings.html" class="dl-sidebar-link">
            <i class="bi bi-gear" aria-hidden="true"></i>
            <span>Settings</span>
          </a>
        </li>
      </ul>

      <!-- Sidebar Footer: View Store & Theme Toggle -->
      <div class="dl-sidebar-footer">
        <a href="../customer/catalog.html" class="dl-sidebar-viewstore">
          <i class="bi bi-shop" aria-hidden="true"></i>
          <span>View store</span>
          <i class="bi bi-arrow-up-right ms-auto small opacity-75" aria-hidden="true"></i>
        </a>
        <button type="button" class="dl-sidebar-theme-btn dl-theme-toggle" aria-label="Toggle dark mode">
          <span class="dl-theme-icon"><i class="bi bi-moon-stars" aria-hidden="true"></i></span>
          <span class="dl-theme-toggle-text">Dark mode</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="dl-admin-main">

      <div style="display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;">
        <div>
          <h1 class="dl-heading mb-1" style="font-size: 1.6rem;">Product Catalog</h1>
          <p class="text-dl-muted mb-0" id="product-count-sub">Manage inventory pricing and stock availability</p>
        </div>
        <div style="max-width: 260px; width: 100%;">
          <input type="search" id="admin-product-search" class="dl-input" placeholder="Search catalog..." style="height: 38px; font-size: 0.88rem;">
        </div>
      </div>

      <!-- Desktop Table -->
      <div class="dl-table-container">
        <table class="dl-table" aria-label="Products table">
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Category</th>
              <th scope="col">Unit</th>
              <th scope="col">Price</th>
              <th scope="col">Stock Status</th>
              <th scope="col">Toggle Availability</th>
            </tr>
          </thead>
          <tbody id="admin-products-tbody">
            <!-- Populated via script -->
          </tbody>
        </table>
      </div>

      <!-- Mobile Stacked Card List -->
      <div class="dl-mobile-card-list" id="admin-products-mobile-list">
        <!-- Populated via script -->
      </div>
    </main>

    <!-- Mobile Bottom Tab Bar -->
    <nav class="dl-mobile-bottom-tabs" aria-label="Mobile Navigation">
      <a href="dashboard.html" class="dl-tab-item">
        <i class="bi bi-speedometer2" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a href="products.html" class="dl-tab-item active" aria-current="page">
        <i class="bi bi-box-seam" aria-hidden="true"></i>
        <span>Products</span>
      </a>
      <a href="orders.html" class="dl-tab-item">
        <div style="position: relative; display: inline-flex;">
          <i class="bi bi-receipt" aria-hidden="true"></i>
          <span class="dl-mobile-tab-badge" id="mobile-pending-badge" style="display: none;">0</span>
        </div>
        <span>Orders</span>
      </a>
      <a href="settings.html" class="dl-tab-item">
        <i class="bi bi-gear" aria-hidden="true"></i>
        <span>Settings</span>
      </a>
    </nav>

  </div>

  <script src="../js/shared/theme.js"></script>
  <script src="../js/shared/storage.js"></script>
  <script src="../js/shared/live.js"></script>
  <script src="../js/shared/ui.js"></script>
  <script src="../js/shopkeeper/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.DukaanTheme) DukaanTheme.init();
      let products = DukaanStorage.getProducts();

      function renderProducts(filterText = '') {
        const tbody = document.getElementById('admin-products-tbody');
        const mobileList = document.getElementById('admin-products-mobile-list');

        const filtered = products.filter(p => 
          !filterText || 
          p.name.toLowerCase().includes(filterText) || 
          p.category.toLowerCase().includes(filterText)
        );

        document.getElementById('product-count-sub').textContent = 
          `Showing ${filtered.length} of ${products.length} items`;

        if (tbody) {
          tbody.innerHTML = filtered.map(p => `
            <tr>
              <td>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                  <img src="../${DukaanUI.escapeHtml(p.image)}" alt="${DukaanUI.escapeHtml(p.name)}" style="width: 38px; height: 38px; object-fit: cover; border-radius: 8px; border: 1px solid var(--dl-border); flex-shrink: 0;" loading="lazy">
                  <strong>${DukaanUI.escapeHtml(p.name)}</strong>
                </div>
              </td>
              <td><span class="text-dl-muted">${DukaanUI.escapeHtml(p.category)}</span></td>
              <td>${DukaanUI.escapeHtml(p.unit)}</td>
              <td><strong>₹${p.price}</strong></td>
              <td>
                ${p.available 
                  ? '<span class="dl-badge dl-badge-in-stock">✓ In Stock</span>' 
                  : '<span class="dl-badge dl-badge-out-stock">✕ Unavailable</span>'}
              </td>
              <td>
                <button type="button" class="btn-dl-secondary btn-toggle-avail" data-id="${p.id}" style="min-height: 32px; padding: 0.25rem 0.65rem; font-size: 0.78rem;">
                  ${p.available ? 'Mark Out of Stock' : 'Mark In Stock'}
                </button>
              </td>
            </tr>
          `).join('');
        }

        if (mobileList) {
          mobileList.innerHTML = filtered.map(p => `
            <div class="dl-admin-item-card">
              <div class="dl-admin-item-header" style="align-items: center;">
                <div style="display: flex; align-items: center; gap: 0.65rem; min-width: 0;">
                  <img src="../${DukaanUI.escapeHtml(p.image)}" alt="${DukaanUI.escapeHtml(p.name)}" style="width: 36px; height: 36px; object-fit: cover; border-radius: 8px; border: 1px solid var(--dl-border); flex-shrink: 0;" loading="lazy">
                  <span class="dl-admin-item-title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${DukaanUI.escapeHtml(p.name)}</span>
                </div>
                ${p.available 
                  ? '<span class="dl-badge dl-badge-in-stock" style="flex-shrink: 0;">✓ In Stock</span>' 
                  : '<span class="dl-badge dl-badge-out-stock" style="flex-shrink: 0;">✕ Unavailable</span>'}
              </div>
              <div class="text-dl-muted small" style="margin-top: 0.35rem;">
                ${DukaanUI.escapeHtml(p.category)} &bull; ${DukaanUI.escapeHtml(p.unit)} &bull; <strong>₹${p.price}</strong>
              </div>
              <div style="margin-top: 0.45rem;">
                <button type="button" class="btn-dl-secondary btn-toggle-avail w-100" data-id="${p.id}" style="min-height: 36px; font-size: 0.82rem;">
                  ${p.available ? 'Mark Out of Stock' : 'Mark In Stock'}
                </button>
              </div>
            </div>
          `).join('');
        }

        // Attach availability toggle listeners
        document.querySelectorAll('.btn-toggle-avail').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            const target = products.find(p => p.id === id);
            if (target) {
              target.available = !target.available;
              target.updatedAt = new Date().toISOString();
              DukaanStorage.saveProducts(products);
              DukaanUI.showToast(`Updated "${target.name}" to ${target.available ? 'In Stock' : 'Unavailable'}`, 'success');
              renderProducts(document.getElementById('admin-product-search').value.toLowerCase().trim());
            }
          });
        });
      }

      renderProducts();

      document.getElementById('admin-product-search').addEventListener('input', (e) => {
        renderProducts(e.target.value.toLowerCase().trim());
      });
    });
  </script>
</body>
</html>
